# The check job of rune-ui.yml (fmt, clippy, tests on the three systems), run on pushes to the branch the plan tools are written on.
# rune-ui.yml starts only for main and IPedrax-Test/Rune-GUI, so a work branch of the Rune UI would get no check from it. Nothing else
# of that workflow (the builds and the measurements) is repeated here. Drop this file when the branch is merged into Rune-GUI.
name: Rune UI tools check

on:
  push:
    branches: ['IPedrax-Test/Rune-GUI-tools']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rune-ui-tools-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, runner: ubuntu-24.04 }
          - { name: Windows, runner: windows-latest }
          - { name: macOS, runner: macos-15 }
    defaults:
      run:
        shell: bash
        working-directory: crates/ui-rune
    steps:
      - uses: actions/checkout@v4

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libxkbcommon-x11-0

      - name: Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy --component rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/ui-rune

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked
