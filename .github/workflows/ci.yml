# What a pull request has to pass: the three checks CLAUDE.md asks for before anything is finished, on the three systems the app
# ships for (the release workflow tests on all three too, but only once a tag is pushed, which is late to find a Windows or macOS break).
# It runs for pull requests from forks as well, with a read-only token and no secrets: `pull_request`, never `pull_request_target`.
# A first-time contributor's run waits for a maintainer's approval on GitHub's side (Actions > the run > Approve and run).
name: CI

on:
  pull_request:
  # Pushes to main as well: they go in without a pull request, and a Windows or macOS break shouldn't wait for a tag. And pushes to
  # IPedrax-Test/** branches: work in progress is checked here on all three systems, so a session needn't build and test it all
  # on the maintainer's own machine before it reaches main.
  push:
    branches: [main, 'IPedrax-Test/**']
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request makes the run before it pointless.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    # Windows builds and tests the slowest: about 55 minutes before its desktop tests start. Linux and macOS take 55 to 62
    # minutes with no build cache (a new Rust, or a branch before main has saved one), which 60 left no room for.
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest Ubuntu runner, as the release workflow's Linux job.
          # 120: with the wood framing tests (r12) and the stacked batches over it the core's unit tests alone took 45 minutes on a slow
          # runner and the job reached 90 minutes in its last test crate, twice.
          - { name: Linux, runner: ubuntu-22.04, timeout: 120 }
          # Windows and macOS compile slowly (Windows 32 minutes, macOS 35, Linux 13) and took 74 to 92 and 64 to 86 minutes in all on
          # main. Their crates are built without debug info and the timings are kept (below), so a slow run shows what is left to cut.
          # They also leave out the three tests that run longest, which only Linux runs: the hostile sweep and the two random-edit
          # oracles of the 3D scene. They check the model's logic, not the platform, and were two thirds of the core's test time on
          # Windows (the three alone: 1,470 of 2,220 seconds).
          - { name: Windows, runner: windows-latest, timeout: 100, test_flags: '--config ci/fast-build.toml --timings', test_args: '-- --skip hostile_params_never_panic_or_break_the_model --skip view3d::update::tests::random_edits' }
          - { name: macOS, runner: macos-15, timeout: 120, test_flags: '--config ci/fast-build.toml --timings', test_args: '-- --skip hostile_params_never_panic_or_break_the_model --skip view3d::update::tests::random_edits' }
    steps:
      - uses: actions/checkout@v4

      # The X11, Wayland and GL headers egui's window builds against, as the release workflow installs them.
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - name: Rust
        shell: bash
        run: rustup update stable && rustup default stable && rustup component add rustfmt clippy

      # Runners of one kind differ: the Linux test step alone took 26 to 63 minutes. The CPU says whether a slow run was unlucky.
      - name: Machine
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) grep -m1 'model name' /proc/cpuinfo; nproc ;;
            macOS) sysctl -n machdep.cpu.brand_string hw.ncpu ;;
            Windows) powershell -NoProfile -Command "(Get-CimInstance Win32_Processor).Name; (Get-CimInstance Win32_Processor).NumberOfLogicalProcessors" ;;
          esac

      # The dependencies' builds, kept between runs (egui and wgpu from scratch take about 15 minutes). Only main saves the cache, so
      # branch runs reuse it without filling the repository's 10 GB of caches with a copy each.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Translation catalogs
        if: runner.os == 'Linux'
        run: cargo i18n check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The test fixture of the guest SDK is built with it for WebAssembly: the module the plugin tests load. It is
      # not in the repository, and `cargo test` fails without it here (the tests skip only outside CI). The plugin and
      # window tests run on every runner, so this step does too.
      - name: Sample plugin
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --manifest-path crates/plugin/tests/sample-plugin/Cargo.toml --target wasm32-unknown-unknown --release

      - name: Test
        run: cargo test --workspace ${{ matrix.test_flags }} ${{ matrix.test_args }}

      - uses: actions/upload-artifact@v4
        if: runner.os != 'Linux' && always()
        with:
          name: ${{ matrix.name }}-timings
          path: target/cargo-timings/cargo-timing.html
          if-no-files-found: ignore

      # Whether the runner's 7 GB ran out while the crates compiled: swap in use at the end says it did.
      - name: macOS memory
        if: runner.os == 'macOS' && always()
        run: sysctl hw.memsize vm.swapusage && vm_stat

  # What CLAUDE.md asks after touching ifc.rs: IfcOpenShell validates what BIMCraft writes, with the EXPRESS rules, and builds every
  # product's shape. The sample house, and ci/ifc-coverage.txt for what the sample doesn't reach (structure, runs, masses, phases).
  ifc:
    name: IFC (IfcOpenShell)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        run: rustup update stable && rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # pytest: IfcOpenShell's EXPRESS rule checker runs through it.
      - name: IfcOpenShell
        run: pip install ifcopenshell==0.8.5 pytest

      - name: Write IFC
        run: |
          cargo run -q -p bimcraft-cli -- run --sample --save house.ifc
          cargo run -q -p bimcraft-cli -- run --script ci/ifc-coverage.txt --save coverage.ifc
          cargo run -q -p bimcraft-cli -- run --script ci/family-window.txt --save family-window.ifc
          cargo run -q -p bimcraft-cli -- run --cmd 'grid {"name":"Solo","start":[100,200],"end":[3100,4200]}' --save grid-single.ifc
          cargo run -q -p bimcraft-cli -- run --cmd 'grid {"start":[0,0],"end":[0,3000]}' --cmd 'grid {"start":[1000,0],"end":[1000,3000]}' --save grid-parallel.ifc
          cargo run -q -p bimcraft-cli -- run --script ci/ifc-coverage.txt --cmd 'export {"format": "ifc4x3", "path": "coverage-4x3.ifc"}'
          cargo run -q -p bimcraft-cli -- run --sample --cmd 'export {"format": "ifc2x3", "path": "house-2x3.ifc"}'
          cargo run -q -p bimcraft-cli -- run --script ci/ifc-coverage.txt --cmd 'export {"format": "ifc2x3", "path": "coverage-2x3.ifc"}'

      # family-window.ifc: the Family Editor's exit test (F10) as commands, a parametric window placed, flexed and scheduled.
      - name: Validate
        run: python ci/validate_ifc.py house.ifc coverage.ifc family-window.ifc grid-single.ifc grid-parallel.ifc coverage-4x3.ifc house-2x3.ifc coverage-2x3.ifc

  # What CLAUDE.md asks after touching packaging/: shellcheck on the scripts and actionlint on the workflows (which runs shellcheck
  # on their `run:` steps too). The runner image has shellcheck; actionlint is a pinned release, checked against its sum.
  scripts:
    name: Scripts and workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: find packaging -name '*.sh' -print0 | xargs -0 shellcheck

      - name: Discord release post
        run: python3 ci/discord_release.py --self-test

      # ci/fast-build.toml names the workspace's crates one by one (see its header): a new crate not named there keeps its debug info.
      - name: Build config names every crate
        run: |
          while read -r name; do
            grep -q "^\[profile.dev.package.$name\]" ci/fast-build.toml || { echo "ci/fast-build.toml does not name $name"; exit 1; }
          done < <(cargo metadata --no-deps --format-version 1 | python3 -c 'import json, sys; print(*(p["name"] for p in json.load(sys.stdin)["packages"]), sep="\n")')

      - name: actionlint
        run: |
          curl -sSfL -o actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint
          ./actionlint -color
