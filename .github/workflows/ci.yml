# Throwaway, never merged: regenerates the translation catalogs of a branch on CI, and compiles everything (clippy) for a quick answer.
name: CI

on:
  push:
    branches: ['IPedrax-Test/i18n-round']

permissions:
  contents: read

jobs:
  catalogs:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        run: rustup update stable && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Regenerate the catalogs
        run: cargo i18n update && cargo i18n check
      - uses: actions/upload-artifact@v4
        with:
          name: catalogs
          path: translations/
