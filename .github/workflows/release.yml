# The installers: on a version tag (v0.1.0) each platform's job tests and packages BIMCraft, and the
# last job publishes them all as that tag's release; run by hand, they stay as the run's artifacts.
#   Windows  bimcraft-<version>-windows-x64.msi
#   Linux    bimcraft-<version>-linux-<x86_64|aarch64>.{AppImage,AppImage.zsync,deb,rpm,tar.gz,flatpak,pkg.tar.zst}
#            bimcraft-<version>-linux-riscv64.{deb,rpm,tar.gz}
#   macOS    bimcraft-<version>-macos-universal.dmg, bimcraft-cli-<version>-macos-universal.zip
# The desktop app updates itself from three of these, by name: the .msi, the .AppImage of each architecture and the .dmg
# (`Target::asset_name` in crates/update). Rename one here and there, or updates stop installing. Each must be published with
# `gh release create`, which is what gives it the SHA-256 digest the updater checks it against.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        run: rustup update stable && rustup default stable

      # As in ci.yml: the plugin tests load the guest SDK's sample module, which is not in the repository, and fail in CI
      # without it.
      - name: Sample plugin
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --manifest-path crates/plugin/tests/sample-plugin/Cargo.toml --target wasm32-unknown-unknown --release

      - name: Test
        run: cargo test --workspace

      # The C runtime linked in, as CADCraft does, so the exes run on a Windows without the Visual C++
      # redistributable. Scoped to the target, so build scripts and proc macros are left as they are.
      - name: Build
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked --target x86_64-pc-windows-msvc -p bimcraft -p bimcraft-cli

      - name: Check
        shell: pwsh
        run: |
          $bin = "$PWD\target\x86_64-pc-windows-msvc\release"
          # Explorer shows bimcraft.exe with the icon its build script links in: count it the way Explorer does.
          Add-Type -Namespace Win32 -Name Shell -MemberDefinition '[DllImport("shell32.dll", CharSet = CharSet.Unicode)] public static extern int ExtractIconExW(string file, int index, IntPtr large, IntPtr small, int n);'
          $icons = [Win32.Shell]::ExtractIconExW("$bin\bimcraft.exe", -1, [IntPtr]::Zero, [IntPtr]::Zero, 0)
          if ($icons -ne 1) { throw "bimcraft.exe should carry one icon, not $icons" }
          # This runner has the Visual C++ runtime, so a build needing it would pass here and fail on a clean PC.
          # ponytail: looks for the DLL's name anywhere in the file, not just in the import table.
          foreach ($exe in 'bimcraft.exe', 'bimcraft-cli.exe') {
            $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes("$bin\$exe"))
            if ($text.IndexOf('VCRUNTIME140', [StringComparison]::OrdinalIgnoreCase) -ge 0) { throw "$exe needs the Visual C++ runtime" }
          }

      - name: Installer
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          dotnet tool install --global wix --version 5.0.2
          $wix = "$env:USERPROFILE\.dotnet\tools\wix.exe"
          & $wix extension add -g WixToolset.UI.wixext/5.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The desktop app's updater takes this exact name from the release (`Target::asset_name` in crates/update), and installs it
          # only if it matches the SHA-256 digest GitHub gives the uploaded asset: rename it there too, or updates stop installing.
          $msi = "bimcraft-$version-windows-x64.msi"
          & $wix build packaging/windows/bimcraft.wxs -arch x64 -ext WixToolset.UI.wixext -d Version=$version -d BinDir=target\x86_64-pc-windows-msvc\release -o $msi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -Path $env:GITHUB_ENV -Value "MSI=$msi"

      # Installs the MSI to a folder of the user's choosing, upgrades it with a rebuild (another product code, the same
      # upgrade code) and removes it: the folder has to survive the upgrade, as it must when an update runs the installer.
      - name: Install elsewhere
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $rebuilt = "$env:RUNNER_TEMP\rebuilt.msi"
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" build packaging/windows/bimcraft.wxs -arch x64 -ext WixToolset.UI.wixext -d Version=$version -d BinDir=target\x86_64-pc-windows-msvc\release -o $rebuilt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          packaging/windows/check-install.ps1 -Msi $env:MSI -Upgrade $rebuilt

      # The same programs without an installer, for a PC whose user can't install software. Unzipped and run before it is uploaded.
      - name: Portable zip
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          packaging/windows/portable.ps1 -Version $version -BinDir target\x86_64-pc-windows-msvc\release

      - uses: actions/upload-artifact@v4
        with:
          name: bimcraft-windows-x64
          path: |
            ${{ env.MSI }}
            ${{ env.PORTABLE }}

  linux:
    name: Linux ${{ matrix.arch }}
    # The oldest Ubuntu runner, so the binaries need glibc 2.35 at most and run on the distros after it.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-22.04, deb: amd64 }
          - { arch: aarch64, runner: ubuntu-22.04-arm, deb: arm64 }
    steps:
      - uses: actions/checkout@v4

      # The X11, Wayland and GL headers egui's window builds against; the tools that check the
      # desktop entry and the AppStream metadata, and write the AppImage's .zsync; nfpm for the deb and rpm.
      # Ubuntu's archive can hang a download for the job's six hours; a slow mirror has taken 17 minutes.
      - name: Tools
        timeout-minutes: 30
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev desktop-file-utils appstream zsync
          packaging/linux/install-nfpm.sh ${{ matrix.deb }}

      - name: Rust
        run: rustup update stable && rustup default stable

      # As in ci.yml: the plugin tests load the guest SDK's sample module, which is not in the repository, and fail in CI
      # without it.
      - name: Sample plugin
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --manifest-path crates/plugin/tests/sample-plugin/Cargo.toml --target wasm32-unknown-unknown --release

      - name: Test
        run: cargo test --workspace

      - name: Build and package
        run: packaging/linux/package.sh

      - name: Check
        run: |
          dpkg-deb --info dist/release/*.deb
          dpkg-deb --contents dist/release/*.deb | grep -E 'usr/bin/|metainfo|applications|mime'
          rpm -qip dist/release/*.rpm
          for appimage in dist/release/*.AppImage; do
            chmod +x "$appimage"
            APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" --version
          done

      - uses: actions/upload-artifact@v4
        with:
          name: bimcraft-linux-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

  # The Flatpak and the Arch package repackage the Linux job's tarball: the same binaries as the
  # AppImage, the deb and the rpm.
  flatpak:
    name: Flatpak ${{ matrix.arch }}
    needs: linux
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: bimcraft-linux-${{ matrix.arch }}
          path: dist/linux

      - name: Tools
        timeout-minutes: 30
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder librsvg2-common
          # Ubuntu 24.04 turns unprivileged user namespaces off, which flatpak-builder's sandbox needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Builds the bundle, installs it per user and runs bimcraft-cli --version inside its sandbox.
      - name: Build and check the bundle
        run: packaging/linux/flatpak-bundle.sh dist/linux/bimcraft-*-linux-${{ matrix.arch }}.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: bimcraft-flatpak-${{ matrix.arch }}
          path: dist/release/*.flatpak
          if-no-files-found: error

  arch:
    name: Arch ${{ matrix.arch }}
    needs: linux
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: bimcraft-linux-${{ matrix.arch }}
          path: dist/linux

      # makepkg exists only on Arch and refuses root: an Arch container, and an ordinary user in it.
      # The package holds only the tarball's files, so this x86_64 runner makes the aarch64 one too.
      - name: Build the package
        run: |
          mkdir -p dist/release && chmod 777 dist/release
          docker run --rm -i -e TARGET="${{ matrix.arch }}" -e SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            -v "$PWD:/work" -w /work archlinux:base-devel bash -s <<'EOF'
          set -euo pipefail
          useradd -m builder
          su builder -c "cd /work && DIST=/work/dist/release CARGO_TARGET_DIR=/tmp/target packaging/linux/arch-package.sh --arch $TARGET dist/linux/bimcraft-*-linux-$TARGET.tar.gz"
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: bimcraft-arch-${{ matrix.arch }}
          path: dist/release/*.pkg.tar.zst
          if-no-files-found: error

  linux-riscv64:
    name: Linux riscv64
    # Cross-built on Ubuntu 24.04, whose ports archive has the riscv64 libraries to build against: the
    # packages need glibc 2.39 or later. No AppImage: appimagetool has no riscv64 runtime.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        timeout-minutes: 30
        run: |
          . /etc/os-release
          sudo dpkg --add-architecture riscv64
          # The archive's sources keep to amd64; riscv64 comes from the ports archive.
          sudo sed -i '/^Types: deb/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          for suite in "$VERSION_CODENAME" "$VERSION_CODENAME-updates" "$VERSION_CODENAME-security"; do
            echo "deb [arch=riscv64] https://ports.ubuntu.com/ubuntu-ports $suite main universe restricted multiverse"
          done | sudo tee /etc/apt/sources.list.d/riscv64.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            libc6-dev-riscv64-cross libc6-dev:riscv64 qemu-user pkg-config desktop-file-utils appstream \
            libxkbcommon-dev:riscv64 libwayland-dev:riscv64 libx11-dev:riscv64 libxrandr-dev:riscv64 \
            libxi-dev:riscv64 libgl1-mesa-dev:riscv64
          packaging/linux/install-nfpm.sh amd64

      - name: Rust
        run: rustup update stable && rustup default stable && rustup target add riscv64gc-unknown-linux-gnu

      # package.sh runs both binaries once under QEMU.
      - name: Build and package
        env:
          CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER: riscv64-linux-gnu-gcc
          PKG_CONFIG_SYSROOT_DIR: /
          PKG_CONFIG_PATH: /usr/lib/riscv64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          PKG_CONFIG_ALLOW_CROSS: "1"
          CROSS_ARCH: riscv64
          CROSS_TARGET: riscv64gc-unknown-linux-gnu
          CROSS_COMPILE: riscv64-linux-gnu-
          EMULATOR: qemu-riscv64
          QEMU_LD_PREFIX: /usr/riscv64-linux-gnu
        run: packaging/linux/package.sh --formats "deb rpm tar"

      - name: Check
        run: |
          dpkg-deb --info dist/release/*-linux-riscv64.deb
          dpkg-deb --contents dist/release/*-linux-riscv64.deb | grep -E 'usr/bin/|metainfo|applications|mime'
          rpm -qip dist/release/*-linux-riscv64.rpm

      - uses: actions/upload-artifact@v4
        with:
          name: bimcraft-linux-riscv64
          path: dist/release/*
          if-no-files-found: error

  macos:
    name: macOS universal
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        run: |
          rustup update stable && rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # As in ci.yml: the plugin tests load the guest SDK's sample module, which is not in the repository, and fail in CI
      # without it.
      - name: Sample plugin
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --manifest-path crates/plugin/tests/sample-plugin/Cargo.toml --target wasm32-unknown-unknown --release

      - name: Test
        run: cargo test --workspace

      # Without the secrets (a fork, say) the app is signed ad hoc and not notarized: it runs, but
      # Gatekeeper asks before it does.
      - name: Signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: packaging/macos/import-cert.sh

      - name: Build, sign and notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: packaging/macos/package.sh --arch universal

      - uses: actions/upload-artifact@v4
        with:
          name: bimcraft-macos-universal
          path: dist/release/*
          if-no-files-found: error

      - name: Remove the keychain
        if: always()
        run: if [ -n "${MACOS_KEYCHAIN:-}" ]; then security delete-keychain "$MACOS_KEYCHAIN" || true; fi

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux, flatpak, arch, linux-riscv64, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --title "BIMCraft ${{ github.ref_name }}" --generate-notes
