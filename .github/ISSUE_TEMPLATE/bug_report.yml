name: Bug report
description: Something in BIMCraft does not work as it should
title: "[Bug Report] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. A bug that can be reproduced can be fixed, so the more of this form you fill in, the faster it goes.

        Please look through the [issues](https://github.com/IPedrax/BIMCraft/issues?q=is%3Aissue) first. If yours is there, add what you know to it instead of opening another.

  - type: checkboxes
    id: checks
    attributes:
      label: Before you send
      options:
        - label: I looked through the open and closed issues and did not find this one.
          required: true
        - label: I am not attaching Autodesk files (`.rvt`, `.rfa`) or anything copied from Autodesk's products. BIMCraft is clean-room.
          required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
      description: "A sentence or two. For example: Clicking fast while drawing a wall skips points; every click should place one."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: |
        From a fresh start, one step to a line. Say which tool you were using (Wall, Door, Modify, Demolish and so on) and in which view (plan, section, sheet or 3D). Starting from the sample house (`bimcraft --sample`) makes the steps easy to follow.
      placeholder: |
        1. Open the sample house
        2. Choose Architecture > Wall
        3. ...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where does it happen?
      options:
        - Desktop app (the window)
        - Command line or MCP server (bimcraft-cli)
        - IFC import or export
        - Plans, sections, sheets, schedules or PDF output
        - Installer
        - Something else
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: BIMCraft version
      description: "Windows: Settings > Apps > Installed apps > BIMCraft, or the installer's file name (bimcraft-0.8.0-windows-x64.msi). Built from source: the tag, or the output of git rev-parse --short HEAD."
      placeholder: "0.8.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - Linux
        - macOS
        - Other
    validations:
      required: true

  - type: input
    id: pointer
    attributes:
      label: Mouse, trackpad or pen
      description: "For clicks, drags and cursor problems: which one you use, and any mouse software or touchscreen. Leave empty if it does not apply."

  - type: input
    id: display
    attributes:
      label: Display and graphics
      description: "For drawing, 3D or window problems: screen scaling (for example 150%), the graphics card and its driver version. Leave empty if it does not apply."

  - type: textarea
    id: files
    attributes:
      label: A project or commands that show it
      description: |
        The surest way to see a problem is to run it. Paste the commands that build it (for example `bimcraft-cli run --cmd 'wall {"points": [[0,0],[8000,0]]}'`), or drag a small project into this box. GitHub takes only some kinds of file, so zip a `.bimcraft` or `.ifc` file first. Screenshots or a short screen recording help when the problem is how something looks or feels.

        This is a public repository: attach only what you are happy to share.

  - type: textarea
    id: output
    attributes:
      label: Error messages
      description: Anything the window's status line or the command printed, pasted as text rather than a picture.
      render: text
