[package]
name = "area-summary"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "The example BIMCraft plugin: a summary of the rooms' areas, read from the model and written back as a note"

# A plugin is a module of its own, not a member of BIMCraft's workspace: it is built for the WebAssembly target with
# `cargo build --target wasm32-unknown-unknown --release`, and its SDK is the only thing it needs.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
bimcraft-plugin-sdk = { path = "../../crates/plugin-sdk" }
serde_json = "1"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
strip = true