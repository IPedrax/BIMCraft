[package]
name = "bimcraft-cli"
description = "BIMCraft from the command line: scripts, conversion, and an MCP server for agents"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Reads Revit's .rvt and .rfa files. That code is ported from rvt-rs and is Apache-2.0 only (docs/rvt-provenance.md),
# so a build without it, which keeps the repository's MIT OR Apache-2.0, is `--no-default-features`.
default = ["rvt", "dwg"]
rvt = ["dep:bimcraft-rvt"]
# Reads DWG drawings in `import_cad`, through bimcraft-dwg, which uses acadrust (MPL-2.0, unmodified; NOTICE).
dwg = ["dep:bimcraft-dwg"]

[dependencies]
bimcraft-core = { workspace = true }
# PyAddins: the user's Python scripts, which the MCP server writes and runs for agents.
bimcraft-pyaddins = { workspace = true }
bimcraft-rvt = { workspace = true, optional = true }
bimcraft-dwg = { workspace = true, optional = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# DWG files made from DXF text, for the test of the child that reads them.
bimcraft-dwg = { workspace = true, features = ["testing"] }
# Synthetic Revit-shaped files for the tests of `info`.
bimcraft-rvt = { workspace = true, features = ["testing"] }
