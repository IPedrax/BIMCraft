[package]
name = "bimcraft-ui-egui"
description = "BIMCraft's desktop front end in egui: a thin shell over the core's Session"
version.workspace = true
edition.workspace = true
license.workspace = true
# egui 0.36 needs Rust 1.95; the core and the CLI still build with 1.90.
rust-version = "1.95"

[lints]
workspace = true

[dependencies]
bimcraft-i18n = { workspace = true }
bimcraft-core = { workspace = true }
bimcraft-update = { workspace = true }
serde_json = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true }
pollster = "1"
rfd = { workspace = true }
sys-locale = { workspace = true }

[features]
visual-tests = ["egui_kittest/wgpu"]

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile = { workspace = true }
egui_kittest = { workspace = true }
bimcraft-update = { workspace = true, features = ["testing"] }

[build-dependencies]
bimcraft-i18n = { workspace = true, features = ["catalog"] }
