[package]
name = "bimcraft-ui-egui"
description = "BIMCraft's desktop front end in egui: a thin shell over the core's Session"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
bimcraft-i18n = { workspace = true }
bimcraft-core = { workspace = true }
bimcraft-plugin = { workspace = true }
bimcraft-assistant = { workspace = true }
bimcraft-cowork = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
quick-xml = { version = "0.41", features = ["serialize"] }
egui = { workspace = true }
eframe = { workspace = true }
pollster = "1"
rayon = { workspace = true }
bytemuck = "1"
rfd = { workspace = true }
sys-locale = { workspace = true }
web-time = { workspace = true }

# Only the desktop phones home: a browser build has no updater.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bimcraft-update = { workspace = true }

# The browser's file chooser and downloads (`web/dialog.rs`).
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
# The picked file's size, to refuse one too large before reading it.
rfd = { workspace = true, features = ["file-handle-inner"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Blob", "Document", "Element", "File", "HtmlAnchorElement", "HtmlElement", "Node", "Url", "Window"] }

# The 3D mouse (`spacemouse.rs`), read from its HID reports through hidapi's own Windows backend: pure Rust, MIT.
[target.'cfg(windows)'.dependencies]
hidapi = { version = "2.6.7", default-features = false, features = ["windows-native"] }

[dev-dependencies]
tempfile = { workspace = true }
# `wgpu` lets a test render the window to a picture (looking at the result); `image` names the picture's type.
egui_kittest = { workspace = true, features = ["wgpu"] }
image = { version = "0.25", default-features = false }
bimcraft-update = { workspace = true, features = ["testing"] }
bimcraft-assistant = { workspace = true, features = ["testing"] }

[build-dependencies]
bimcraft-i18n = { workspace = true, features = ["catalog"] }
