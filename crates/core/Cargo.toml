[package]
name = "bimcraft-core"
description = "BIMCraft building model, command engine, views, sheets and IFC export"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
bimcraft-i18n = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tiny-skia = { workspace = true }
flate2 = { workspace = true }
krilla = { workspace = true }
zune-jpeg = { workspace = true }
zune-jpegxl = { workspace = true }
zune-core = { workspace = true }
jpeg-encoder = { workspace = true }
encoding_rs = { workspace = true }
getrandom = { workspace = true }
tempfile = { workspace = true }
rayon = { workspace = true }
web-time = { workspace = true }
ttf-parser = { workspace = true }
proj4rs = { workspace = true }
crs-definitions = { workspace = true }

# In a browser the random numbers are the page's (with `--cfg getrandom_backend="wasm_js"`, in .cargo/config.toml).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }

[build-dependencies]
bimcraft-i18n = { workspace = true, features = ["catalog"] }

[dev-dependencies]
# Decodes the JPEG XL pictures exports write, to check they are lossless.
jxl-oxide = { version = "0.12", default-features = false }
# A counting allocator, as the apps have, for the test of reads held to the memory that's free (`tests/memory_budget.rs`).
cap = { workspace = true }
