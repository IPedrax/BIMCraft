getrandom = { workspace = true }
tempfile = { workspace = true }
rayon = { workspace = true }
ttf-parser = { workspace = true }
zip = { version = "9.2.0", default-features = false, features = ["deflate"] }
quick-xml = "0.41"

[build-dependencies]
bimcraft-i18n = { workspace = true, features = ["catalog"] }
