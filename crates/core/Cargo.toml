[package]
name = "bimcraft-core"
description = "BIMCraft building model, command engine, views, sheets and IFC export"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tiny-skia = { workspace = true }
flate2 = { workspace = true }
zune-jpeg = { workspace = true }
getrandom = { workspace = true }
tempfile = { workspace = true }
rayon = { workspace = true }
web-time = { workspace = true }

# In a browser the random numbers are the page's (with `--cfg getrandom_backend="wasm_js"`, in .cargo/config.toml).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }
