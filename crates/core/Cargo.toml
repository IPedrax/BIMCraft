[package]
name = "bimcraft-core"
description = "BIMCraft building model, command engine, views, sheets and IFC export"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
bimcraft-i18n = { workspace = true }
