[package]
name = "bimcraft-core"
description = "BIMCraft building model, command engine, views, sheets and IFC export"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["laz"]
# Reads LAZ point clouds (the laz crate is Apache-2.0 only, so a binary built with it is Apache-2.0).
laz = ["dep:laz"]

[dependencies]
bimcraft-i18n = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tiny-skia = { workspace = true }
flate2 = { workspace = true }
krilla = { workspace = true }
zune-jpeg = { workspace = true }
zune-jpegxl = { workspace = true }
zune-core = { workspace = true }
jpeg-encoder = { workspace = true }
hayro = { workspace = true }
encoding_rs = { workspace = true }
getrandom = { workspace = true }
tempfile = { workspace = true }
rayon = { workspace = true }
# LAZ (and COPC) point clouds, through the laz crate, Apache-2.0 only: on by default, and a build without it refuses LAZ.
laz = { workspace = true, optional = true }
ttf-parser = { workspace = true }
proj4rs = { workspace = true }
crs-definitions = { workspace = true }

zip = { version = "9.2.0", default-features = false, features = ["deflate-flate2"] }
quick-xml = "0.41"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "1.1.5", features = ["fs"] }

[build-dependencies]
bimcraft-i18n = { workspace = true, features = ["catalog"] }

[dev-dependencies]
# Decodes the JPEG XL pictures exports write, to check they are lossless.
jxl-oxide = { version = "0.12", default-features = false }
# A counting allocator, as the apps have, for the test of reads held to the memory that's free (`tests/memory_budget.rs`).
cap = { workspace = true }
