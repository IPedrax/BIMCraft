[package]
name = "bimcraft-assistant"
description = "BIMCraft's assistant: an AI chat, on the user's own key, that manages the open project through its commands"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# `testing::Fake`, a network that is a queue of replies, for the desktop's tests too.
testing = []

[dependencies]
bimcraft-core = { workspace = true }
serde_json = { workspace = true }
ureq = { workspace = true }
# The folder the files sent with a message are copied into, removed as it is dropped.
tempfile = { workspace = true }
# The saved key's encryption: the same ring the updater's SHA-256 is.
ring = { workspace = true }
