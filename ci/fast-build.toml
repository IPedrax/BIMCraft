# Read by the Windows and macOS jobs' `cargo test` (`--config ci/fast-build.toml`, in ci.yml). The workspace's own crates are built
# without debug info: bimcraft-core is optimised even in a debug build, and on those runners its debug info made the compile the
# longest part of the job (macOS: 3 cores and 7 GB). The dependencies keep the profile main's build cache was made with, so the
# cache stays valid.
[profile.dev]
debug = 0

[profile.dev.package."*"]
debug = true
